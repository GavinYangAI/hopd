name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

jobs:
  # Build the CLI for darwin/linux × amd64/arm64 and cut the GitHub release.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Package the macOS menu-bar app and attach it to the same release.
  macos-app:
    needs: cli
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Fyne packaging tool
        run: go install fyne.io/fyne/v2/cmd/fyne@v2.7.4

      - name: Package hopd-gui.app
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          RELEASE_BUNDLE_VERSION="${GITHUB_REF_NAME#v}"
          make gui-package BUNDLE_VERSION="$RELEASE_BUNDLE_VERSION"
          ditto -c -k --sequesterRsrc --keepParent hopd-gui.app "hopd-gui_${GITHUB_REF_NAME}_macos.zip"

      - name: Verify bundle version
        run: |
          EXPECTED_BUNDLE_VERSION="${GITHUB_REF_NAME#v}"
          ACTUAL_BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" hopd-gui.app/Contents/Info.plist)
          test "$ACTUAL_BUNDLE_VERSION" = "$EXPECTED_BUNDLE_VERSION"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "hopd-gui_${GITHUB_REF_NAME}_macos.zip" --clobber
